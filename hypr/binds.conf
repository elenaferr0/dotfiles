# Hyprland Key Bindings Configuration

# Set modifier key
$mod = SUPER

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Basic window management
bind = $mod, Return, exec, alacritty
bind = $mod, Q, killactive
# bind = $mod SHIFT, E, exit

bind = $mod, space, togglesplit
bind = $mod, F, fullscreen, 1  # maximize
bind = $mod, V, togglefloating

# Resize windows
bind = $mod, minus, splitratio, -0.25
bind = $mod SHIFT, minus, splitratio, -0.3333333
bind = $mod, equal, splitratio, 0.25
bind = $mod SHIFT, equal, splitratio, 0.3333333

# Workspace bindings (1-9)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move window to workspace (silent)
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9

# Move focus with arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move focus with vim keys
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows with arrow keys
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Move windows with vim keys
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Move monitor focus with arrow keys
bind = $mod ALT, left, focusmonitor, l
bind = $mod ALT, right, focusmonitor, r
bind = $mod ALT, up, focusmonitor, u
bind = $mod ALT, down, focusmonitor, d

# Move monitor focus with vim keys
bind = $mod ALT, H, focusmonitor, l
bind = $mod ALT, L, focusmonitor, r
bind = $mod ALT, K, focusmonitor, u
bind = $mod ALT, J, focusmonitor, d

# Move workspace to other monitor with arrow keys
bind = $mod ALT SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mod ALT SHIFT, right, movecurrentworkspacetomonitor, r
bind = $mod ALT SHIFT, up, movecurrentworkspacetomonitor, u
bind = $mod ALT SHIFT, down, movecurrentworkspacetomonitor, d

# Move workspace to other monitor with vim keys
bind = $mod ALT SHIFT, H, movecurrentworkspacetomonitor, l
bind = $mod ALT SHIFT, L, movecurrentworkspacetomonitor, r
bind = $mod ALT SHIFT, K, movecurrentworkspacetomonitor, u
bind = $mod ALT SHIFT, J, movecurrentworkspacetomonitor, d

# Hardware keys - Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Hardware keys - Volume
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = SHIFT, XF86AudioRaiseVolume, exec, pactl set-source-volume @DEFAULT_SOURCE@ +5%
bind = SHIFT, XF86AudioLowerVolume, exec, pactl set-source-volume @DEFAULT_SOURCE@ -5%
bind = SHIFT, XF86AudioMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media control (requires playerctl)
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = SHIFT, XF86AudioNext, exec, playerctld shift
bind = SHIFT, XF86AudioPrev, exec, playerctld unshift
bind = SHIFT, XF86AudioPlay, exec, systemctl --user restart playerctld

# Screenshots
bind = $mod, S, exec, grimblast --notify save screen ~/Pictures/screenshots/$(date +%s).png
bind = $mod SHIFT, S, exec, grimblast --notify copy area

# Screen lock and suspend
bind = CTRL ALT, L, exec, systemctl suspend && hyprlock -q
bind = $mod, P, exec, ~/.config/wofi/power-menu.sh 

# Notification management (requires mako)
bind = $mod, W, exec, makoctl dismiss
bind = $mod SHIFT, W, exec, makoctl restore

# Application launcher (requires wofi)
bind = $mod, R, exec, wofi -S run
# bind = $mod, X, exec, hyprctl keyword input:kb_layout $(hyprctl getoption input:kb_layout -j | jq -r '.str | split(",") | [.[1],.[0]] | join(",")')

# Clipboard history (requires cliphist and wofi)
bind = $mod, C, exec, selected=$(cliphist list | wofi -S dmenu) && echo "$selected" | cliphist decode | wl-copy
