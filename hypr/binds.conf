# Hyprland Key Bindings Configuration

# Set modifier key
$mod = SUPER

# Mouse bindings
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Basic window management
bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
# bind = SUPER SHIFT, E, exit

bind = SUPER, space, togglesplit
bind = SUPER, F, fullscreen, 1  # maximize
bind = SUPER, V, togglefloating

# Resize windows
bind = SUPER, minus, splitratio, -0.25
bind = SUPER SHIFT, minus, splitratio, -0.3333333
bind = SUPER, equal, splitratio, 0.25
bind = SUPER SHIFT, equal, splitratio, 0.3333333

# Workspace bindings (1-9)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move window to workspace (silent)
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9

# Move focus with arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move focus with vim keys
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Move windows with arrow keys
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Move windows with vim keys
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Move monitor focus with arrow keys
bind = SUPER ALT, left, focusmonitor, l
bind = SUPER ALT, right, focusmonitor, r
bind = SUPER ALT, up, focusmonitor, u
bind = SUPER ALT, down, focusmonitor, d

# Move monitor focus with vim keys
bind = SUPER ALT, H, focusmonitor, l
bind = SUPER ALT, L, focusmonitor, r
bind = SUPER ALT, K, focusmonitor, u
bind = SUPER ALT, J, focusmonitor, d

# Move workspace to other monitor with arrow keys
bind = SUPER ALT SHIFT, left, movecurrentworkspacetomonitor, l
bind = SUPER ALT SHIFT, right, movecurrentworkspacetomonitor, r
bind = SUPER ALT SHIFT, up, movecurrentworkspacetomonitor, u
bind = SUPER ALT SHIFT, down, movecurrentworkspacetomonitor, d

# Move workspace to other monitor with vim keys
bind = SUPER ALT SHIFT, H, movecurrentworkspacetomonitor, l
bind = SUPER ALT SHIFT, L, movecurrentworkspacetomonitor, r
bind = SUPER ALT SHIFT, K, movecurrentworkspacetomonitor, u
bind = SUPER ALT SHIFT, J, movecurrentworkspacetomonitor, d

# Hardware keys - Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Hardware keys - Volume
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = SHIFT, XF86AudioRaiseVolume, exec, pactl set-source-volume @DEFAULT_SOURCE@ +5%
bind = SHIFT, XF86AudioLowerVolume, exec, pactl set-source-volume @DEFAULT_SOURCE@ -5%
bind = SHIFT, XF86AudioMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media control (requires playerctl)
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = SHIFT, XF86AudioNext, exec, playerctld shift
bind = SHIFT, XF86AudioPrev, exec, playerctld unshift
bind = SHIFT, XF86AudioPlay, exec, systemctl --user restart playerctld

# Screenshots
bind = SUPER, S, exec, grimblast --notify save screen ~/Pictures/screenshots/$(date +%s).png
bind = SUPER SHIFT, S, exec, grimblast --notify copy area

# Screen lock and suspend
bind = SUPER, Escape, exec, systemctl suspend && hyprlock -q

# Notification management (requires mako)
bind = SUPER, W, exec, makoctl dismiss
bind = SUPER SHIFT, W, exec, makoctl restore

# Application launcher (requires wofi)
bind = SUPER, R, exec, wofi -S run
bind = SUPER, X, exec, hyprctl keyword input:kb_layout $(hyprctl getoption input:kb_layout -j | jq -r '.str | split(",") | [.[1],.[0]] | join(",")')

# Clipboard history (requires cliphist and wofi)
bind = SUPER, C, exec, selected=$(cliphist list | wofi -S dmenu) && echo "$selected" | cliphist decode | wl-copy