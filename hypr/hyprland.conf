# Main Hyprland Configuration
# Import other config files
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/autostart.conf

# Environment variables
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = XCURSOR_SIZE,24

# General settings
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    # col.active_border = rgba(aarrggbb)
    # col.inactive_border = rgba(aarrggbb)
    # allow_tearing = true
}

# Cursor settings
cursor {
    inactive_timeout = 4
}

# Group settings
group {
    # col.border_active = rgba(aarrggbb)
    # col.border_inactive = rgba(aarrggbb)
    groupbar {
        font_size = 11
    }
}

# Bind settings
binds {
    movefocus_cycles_fullscreen = false
}

# Input settings
input {
    repeat_rate = 40
    repeat_delay = 300
    kb_layout = us,it
    kb_options = grp:win_space_toggle
    
    touchpad {
        disable_while_typing = false
    }
}

# Device-specific settings
device {
    name = etps/2-elantech-touchpad
    sensitivity = 0.1
    accel_profile = adaptive
    natural_scroll = true
    drag_lock = true
}

# Dwindle layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Master layout
master {
    new_status = master
}

# Miscellaneous settings
misc {
    # vfr = true
    # close_special_on_empty = true
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    swallow_regex = ^(Alacritty|foot)$
}

ecosystem {
    no_update_news = true
}

# Monitor configuration
# You'll need to adjust these based on your actual monitors
monitor = ,addreserved,0,0,0,0
# monitor = MONITOR-NAME,WIDTHxHEIGHT@REFRESH,POSITION,SCALE
# monitor = ,disable  # for disabled monitors
